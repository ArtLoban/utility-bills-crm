<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Utility Bills CRM — Iteration 7a</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #fafafa; }
  body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  * { box-sizing: border-box; }
  button, input, textarea, select { font-family: inherit; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="dashboard.jsx"></script>

<script type="text/babel" data-presets="react">
const { useState: use7State } = React;
const UB7 = window.UB;
const Z7 = UB7.Z;
const ACCENT7 = UB7.ACCENTS.violet;

// ---- Icons ----
const Ico7 = ({ size = 16, children }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
    stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">
    {children}
  </svg>
);

const IcoReceipt7 = ({ size = 16 }) => (
  <Ico7 size={size}>
    <path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1-2-1Z"/>
    <path d="M16 8H8M16 12H8M12 16H8"/>
  </Ico7>
);

const IcoFilterX7 = ({ size = 16 }) => (
  <Ico7 size={size}>
    <path d="M13.013 3H2l8 9.46V19l4 2v-8.054l.26-.31"/>
    <path d="m22 3-5 5"/>
    <path d="m17 3 5 5"/>
  </Ico7>
);

const IcoPlus7 = ({ size = 14 }) => (
  <Ico7 size={size}><path d="M5 12h14M12 5v14"/></Ico7>
);

const IcoChevDown7 = ({ size = 12 }) => (
  <Ico7 size={size}><path d="m6 9 6 6 6-6"/></Ico7>
);

// ---- Inactive filter select (Screen 1) ----
function FilterSelectInactive({ label }) {
  return (
    <div style={{ position: 'relative', display: 'inline-flex', alignItems: 'center' }}>
      <select disabled style={{
        appearance: 'none', WebkitAppearance: 'none',
        height: 32, padding: '0 28px 0 12px',
        fontSize: 13, fontFamily: 'inherit',
        color: Z7.mutedFg, background: Z7.background,
        border: `1px solid ${Z7.border}`, borderRadius: 6,
        cursor: 'not-allowed', minWidth: 140, opacity: 0.6,
      }}>
        <option>{label}</option>
      </select>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke={Z7.border}
        strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
        style={{ position: 'absolute', right: 8, pointerEvents: 'none' }}>
        <path d="m6 9 6 6 6-6"/>
      </svg>
    </div>
  );
}

// ---- Active filter select (Screen 2) — shows a selected value ----
function FilterSelectActive({ label, active }) {
  return (
    <div style={{ position: 'relative', display: 'inline-flex', alignItems: 'center' }}>
      <select style={{
        appearance: 'none', WebkitAppearance: 'none',
        height: 32, padding: '0 28px 0 12px',
        fontSize: 13, fontFamily: 'inherit',
        color: active ? Z7.foreground : Z7.mutedFg,
        background: active ? ACCENT7.tintBg : Z7.background,
        border: `1px solid ${active ? ACCENT7.tintBorder : Z7.border}`,
        borderRadius: 6,
        cursor: 'pointer', minWidth: 140,
        fontWeight: active ? 500 : 400,
      }}>
        <option>{label}</option>
      </select>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
        stroke={active ? ACCENT7.solid : Z7.mutedFg}
        strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
        style={{ position: 'absolute', right: 8, pointerEvents: 'none' }}>
        <path d="m6 9 6 6 6-6"/>
      </svg>
    </div>
  );
}

// ---- Screen 1 empty state ----
function BillsEmptyFirstTime7() {
  return (
    <div style={{
      display: 'flex', flexDirection: 'column', alignItems: 'center',
      padding: '80px 24px', textAlign: 'center',
    }}>
      <div style={{ color: Z7.mutedFg, marginBottom: 20 }}>
        <IcoReceipt7 size={64} />
      </div>
      <h3 style={{
        margin: '0 0 10px', fontSize: 18, fontWeight: 600,
        color: Z7.foreground, letterSpacing: -0.3,
      }}>
        No bills yet
      </h3>
      <p style={{
        margin: '0 0 28px', fontSize: 14, lineHeight: 1.65,
        color: Z7.mutedFg, maxWidth: 340, textWrap: 'pretty',
      }}>
        Record your first bill to start tracking expenses across your properties.
      </p>
      <button style={{
        display: 'inline-flex', alignItems: 'center', gap: 7,
        height: 36, padding: '0 18px',
        fontSize: 13.5, fontWeight: 500,
        background: ACCENT7.solid, color: '#fff',
        border: 'none', borderRadius: 6, cursor: 'pointer',
        letterSpacing: -0.1,
        boxShadow: '0 1px 3px rgba(124,58,237,0.18)',
      }}>
        <IcoPlus7 size={14} /> Record bill
      </button>
    </div>
  );
}

// ---- Screen 2 empty state ----
function BillsEmptyFiltered7() {
  return (
    <div style={{
      display: 'flex', flexDirection: 'column', alignItems: 'center',
      padding: '80px 24px', textAlign: 'center',
    }}>
      <div style={{ color: Z7.mutedFg, marginBottom: 20 }}>
        <IcoFilterX7 size={64} />
      </div>
      <h3 style={{
        margin: '0 0 10px', fontSize: 18, fontWeight: 600,
        color: Z7.foreground, letterSpacing: -0.3,
      }}>
        No bills match your filters
      </h3>
      <p style={{
        margin: '0 0 28px', fontSize: 14, lineHeight: 1.65,
        color: Z7.mutedFg, maxWidth: 340, textWrap: 'pretty',
      }}>
        Try adjusting the filters or clearing them to see all bills.
      </p>
      <button style={{
        display: 'inline-flex', alignItems: 'center', gap: 7,
        height: 36, padding: '0 18px',
        fontSize: 13.5, fontWeight: 500,
        background: Z7.background, color: Z7.foreground,
        border: `1px solid ${Z7.border}`, borderRadius: 6, cursor: 'pointer',
        letterSpacing: -0.1,
      }}>
        Clear filters
      </button>
    </div>
  );
}

// ---- Shared page shell ----
function BillsPage7({ screen }) {
  const isFiltered = screen === 2;

  return (
    <div style={{
      fontFamily: "'Inter', system-ui, sans-serif",
      WebkitFontSmoothing: 'antialiased',
      background: Z7.background, minHeight: '100vh',
      color: Z7.foreground,
    }}>
      <UB7.TopBar accent={ACCENT7} activeNav="Bills" />

      <div style={{ maxWidth: 1360, margin: '0 auto', padding: '32px 32px 64px' }}>

        {/* Page header */}
        <div style={{
          display: 'flex', alignItems: 'flex-start',
          justifyContent: 'space-between', marginBottom: 24,
        }}>
          <div>
            <h2 style={{
              margin: 0, fontSize: 28, fontWeight: 600,
              letterSpacing: -0.6, color: Z7.foreground,
            }}>Bills</h2>
            <p style={{ margin: '5px 0 0', fontSize: 13, color: Z7.mutedFg }}>
              {isFiltered
                ? <>
                    <span style={{ fontWeight: 500, color: Z7.foreground }}>0</span>
                    {' records · Main apartment · Electricity · Last 3 months'}
                  </>
                : 'No records yet'
              }
            </p>
          </div>

          <button style={{
            display: 'inline-flex', alignItems: 'center', gap: 6,
            height: 34, padding: '0 16px',
            fontSize: 13.5, fontWeight: 500,
            background: ACCENT7.solid, color: '#fff',
            border: 'none', borderRadius: 6,
            cursor: 'pointer',
          }}>
            <IcoPlus7 /> Record bill
          </button>
        </div>

        {/* Filter bar */}
        {isFiltered ? (
          /* Screen 2 — active filters */
          <div style={{
            display: 'flex', alignItems: 'center', gap: 10,
            padding: '10px 14px',
            background: Z7.background,
            border: `1px solid ${Z7.border}`,
            borderRadius: 8, marginBottom: 16, flexWrap: 'wrap',
          }}>
            <span style={{ fontSize: 12.5, color: Z7.mutedFg, paddingLeft: 2 }}>Filter</span>
            <FilterSelectActive label="Main apartment" active={true} />
            <FilterSelectActive label="Electricity" active={true} />
            <FilterSelectActive label="Last 3 months" active={true} />
            <div style={{ flex: 1 }} />
            <button style={{
              background: 'none', border: 'none', cursor: 'pointer',
              fontSize: 12.5, color: ACCENT7.solid,
              textDecoration: 'underline', padding: '0 4px',
              fontWeight: 500,
            }}>
              Clear filters
            </button>
          </div>
        ) : (
          /* Screen 1 — inactive filters */
          <div style={{
            display: 'flex', alignItems: 'center', gap: 10,
            padding: '10px 14px',
            background: Z7.background,
            border: `1px solid ${Z7.border}`,
            borderRadius: 8, marginBottom: 16, flexWrap: 'wrap',
            opacity: 0.55, pointerEvents: 'none',
          }}>
            <span style={{ fontSize: 12.5, color: Z7.mutedFg, paddingLeft: 2 }}>Filter</span>
            <FilterSelectInactive label="All properties" />
            <FilterSelectInactive label="All services" />
            <FilterSelectInactive label="Last 12 months" />
          </div>
        )}

        {/* Empty state card */}
        <div style={{
          background: Z7.card,
          border: `1px solid ${Z7.border}`,
          borderRadius: 8,
          boxShadow: '0 1px 2px 0 rgba(24,24,27,0.05)',
          overflow: 'hidden',
        }}>
          {isFiltered ? <BillsEmptyFiltered7 /> : <BillsEmptyFirstTime7 />}
        </div>

      </div>
    </div>
  );
}

// ---- Screen picker ----
function App7() {
  const [screen, setScreen] = use7State(1);

  const tabs = [
    { id: 1, label: 'Screen 1 — First-time empty' },
    { id: 2, label: 'Screen 2 — Filtered empty' },
  ];

  return (
    <div>
      {/* Floating tab switcher */}
      <div style={{
        position: 'fixed', bottom: 24, left: '50%', transform: 'translateX(-50%)',
        zIndex: 100,
        display: 'flex', gap: 2,
        background: Z7.foreground,
        borderRadius: 10,
        padding: 4,
        boxShadow: '0 4px 24px rgba(9,9,11,0.18)',
      }}>
        {tabs.map(t => (
          <button
            key={t.id}
            onClick={() => setScreen(t.id)}
            style={{
              height: 34, padding: '0 16px',
              fontSize: 12.5, fontWeight: 500,
              borderRadius: 7, border: 'none', cursor: 'pointer',
              background: screen === t.id ? '#ffffff' : 'transparent',
              color: screen === t.id ? Z7.foreground : 'rgba(255,255,255,0.55)',
              transition: 'background 150ms, color 150ms',
              whiteSpace: 'nowrap',
            }}
          >
            {t.label}
          </button>
        ))}
      </div>

      <BillsPage7 screen={screen} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App7 />);
</script>
</body>
</html>
