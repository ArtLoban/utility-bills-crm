<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Utility Bills CRM — Iteration 4</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #18181b; }
  body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  * { box-sizing: border-box; }
  button, input, textarea, select { font-family: inherit; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="dashboard.jsx"></script>
<script type="text/babel" src="sharing-tab.jsx"></script>
<script type="text/babel" src="modal-sharing.jsx"></script>

<script type="text/babel" data-presets="react">
  const W = 1440;

  function Frame({ children }) {
    return (
      <div style={{ width: '100%', height: '100%', overflow: 'hidden', background: '#fff' }}>
        {children}
      </div>
    );
  }

  function App() {
    return (
      <window.DesignCanvas
        title="Utility Bills CRM — Iteration 4"
        subtitle="Sharing tab · Invite · Last-owner protection · Remove user · shadcn New York · Zinc + Violet"
      >
        <window.DCSection
          id="sharing-pages"
          title="Sharing tab"
          subtitle="Owner view (full controls) paired with Editor view (read-only, leave only)"
        >
          <window.DCArtboard id="sharing-owner" label="Sharing · Owner view" width={W} height={720}>
            <Frame><SharingTabOwner/></Frame>
          </window.DCArtboard>
          <window.DCArtboard id="sharing-editor" label="Sharing · Editor view" width={W} height={680}>
            <Frame><SharingTabEditor/></Frame>
          </window.DCArtboard>
        </window.DCSection>

        <window.DCSection
          id="sharing-modals"
          title="Modals"
          subtitle="Invite person · Last-owner protection · Remove user confirmation"
        >
          <window.DCArtboard id="modal-invite" label="Invite person · Editor pre-selected" width={520} height={720}>
            <Backdrop2 label="Invite">
              <InviteModal/>
            </Backdrop2>
          </window.DCArtboard>
          <window.DCArtboard id="modal-last-owner" label="Last-owner protection" width={520} height={560}>
            <Backdrop2 label="Last owner">
              <LastOwnerModal/>
            </Backdrop2>
          </window.DCArtboard>
          <window.DCArtboard id="modal-remove" label="Remove user confirmation" width={520} height={560}>
            <Backdrop2 label="Remove access">
              <RemoveUserModal/>
            </Backdrop2>
          </window.DCArtboard>
        </window.DCSection>
      </window.DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
