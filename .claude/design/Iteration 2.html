<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Utility Bills CRM — Iteration 2</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #18181b; }
  body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  * { box-sizing: border-box; }
  button { font-family: inherit; }
  input, textarea, select { font-family: inherit; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="dashboard.jsx"></script>
<script type="text/babel" src="modal-reading.jsx"></script>
<script type="text/babel" src="bills-list.jsx"></script>
<script type="text/babel" src="modal-bill.jsx"></script>
<script type="text/babel" src="bills-mobile.jsx"></script>

<script type="text/babel" data-presets="react">
  // Artboard height just enough to show modal + stage margins
  const AW = 560, AH = 700;

  function App() {
    return (
      <window.DesignCanvas
        title="Utility Bills CRM — Iteration 2"
        subtitle="shadcn/ui New York · Zinc + Violet · Inter · Light mode"
      >
        <window.DCSection
          id="reading-modal"
          title="Submit Reading — single-zone"
          subtitle="Three states: default, filled (valid), warning (value below last reading)"
        >
          <window.DCArtboard id="reading-default" label="Default · Empty form" width={AW} height={AH}>
            <ModalStage label="Default">
              <ReadingModalDefault/>
            </ModalStage>
          </window.DCArtboard>
          <window.DCArtboard id="reading-filled" label="Filled · Valid value" width={AW} height={AH}>
            <ModalStage label="Filled">
              <ReadingModalFilled/>
            </ModalStage>
          </window.DCArtboard>
          <window.DCArtboard id="reading-warning" label="Warning · Value below last reading" width={AW} height={AH}>
            <ModalStage label="Warning">
              <ReadingModalWarning/>
            </ModalStage>
          </window.DCArtboard>
        </window.DCSection>

        <window.DCSection
          id="reading-2zone"
          title="Submit Reading — two-zone (day / night)"
          subtitle="Three states: default, both zones filled, T2 night warning"
        >
          <window.DCArtboard id="reading-2z-default" label="Default · Empty form" width={AW} height={AH}>
            <ModalStage label="Default">
              <ReadingModal2ZoneDefault/>
            </ModalStage>
          </window.DCArtboard>
          <window.DCArtboard id="reading-2z-filled" label="Filled · Both zones valid" width={AW} height={AH}>
            <ModalStage label="Filled">
              <ReadingModal2ZoneFilled/>
            </ModalStage>
          </window.DCArtboard>
          <window.DCArtboard id="reading-2z-warning" label="Warning · T2 night below last reading" width={AW} height={AH}>
            <ModalStage label="Warning">
              <ReadingModal2ZoneWarning/>
            </ModalStage>
          </window.DCArtboard>
        </window.DCSection>

        <window.DCSection
          id="bills"
          title="Bills list"
          subtitle="156 records · filterable · sortable · paginated · two empty states"
        >
          <window.DCArtboard id="bills-full" label="Bills list · With data" width={1440} height={980}>
            <div style={{ width:'100%', height:'100%', overflow:'hidden', background:'#fff' }}>
              <BillsList/>
            </div>
          </window.DCArtboard>
          <window.DCArtboard id="bills-empty-none" label="Empty · No bills yet" width={1440} height={680}>
            <div style={{ width:'100%', height:'100%', overflow:'hidden', background:'#fff' }}>
              <BillsEmptyNoBills/>
            </div>
          </window.DCArtboard>
          <window.DCArtboard id="bills-empty-filtered" label="Empty · Filters yield no results" width={1440} height={680}>
            <div style={{ width:'100%', height:'100%', overflow:'hidden', background:'#fff' }}>
              <BillsEmptyFiltered/>
            </div>
          </window.DCArtboard>
          <window.DCArtboard id="bills-mobile" label="Mobile · Card layout (390px)" width={390} height={844}>
            <div style={{ width:'100%', height:'100%', background:'#f4f4f5', display:'flex', justifyContent:'center' }}>
              <BillsListMobile/>
            </div>
          </window.DCArtboard>
        </window.DCSection>

        <window.DCSection
          id="add-bill"
          title="Add Bill modal"
          subtitle="Default (empty form) and filled (Electricity + amount with tariff hint + warning)"
        >
          <window.DCArtboard id="add-bill-default" label="Default · Empty form" width={560} height={740}>
            <ModalStage label="Default">
              <AddBillDefault/>
            </ModalStage>
          </window.DCArtboard>
          <window.DCArtboard id="add-bill-filled" label="Filled · Electricity · amount above expected" width={560} height={740}>
            <ModalStage label="Filled + warning">
              <AddBillFilled/>
            </ModalStage>
          </window.DCArtboard>
        </window.DCSection>
      </window.DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
