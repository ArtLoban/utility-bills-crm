<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Utility Bills CRM — Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #fafafa; }
  body { font-family: 'Inter', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  button, input { font-family: inherit; }
  a { text-decoration: none; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">

const useLocalState = React.useState;

// ── Zinc tokens (prefixed Zk to avoid collision) ───────────────
const Zk = {
  background: '#ffffff', foreground: '#09090b', card: '#ffffff',
  muted: '#f4f4f5', mutedFg: '#71717a', border: '#e4e4e7',
  subtle: '#fafafa', destructive: '#dc2626',
};
const AMBER = { line: '#f59e0b', solid: '#d97706', tintBg: '#fef3c7', tintBorder: '#fde68a' };

// ── SVG icon wrapper ───────────────────────────────────────────
function Ico({ size = 16, stroke = 'currentColor', d, fill = 'none', children }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill={fill}
      stroke={stroke} strokeWidth={1.75} strokeLinecap="round" strokeLinejoin="round">
      {d ? <path d={d}/> : children}
    </svg>
  );
}

// ── Card ───────────────────────────────────────────────────────
function Kard({ children, style }) {
  return (
    <div style={{ background: Zk.card, border: `1px solid ${Zk.border}`, borderRadius: 8, boxShadow: '0 1px 2px 0 rgba(24,24,27,0.05)', ...style }}>
      {children}
    </div>
  );
}

// ── Icons ──────────────────────────────────────────────────────
const IcoLayoutDash = (p) => <Ico size={p.size||16} stroke={p.stroke||'currentColor'}><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></Ico>;
const IcoUsers    = (p) => <Ico size={p.size||16} stroke={p.stroke||'currentColor'}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></Ico>;
const IcoHome     = (p) => <Ico size={p.size||16} stroke={p.stroke||'currentColor'}><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></Ico>;
const IcoReceipt  = (p) => <Ico size={p.size||16} stroke={p.stroke||'currentColor'}><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1-2-1Z"/><path d="M16 8H8M16 12H8M12 16H8"/></Ico>;
const IcoArchive  = (p) => <Ico size={p.size||16} stroke={p.stroke||'currentColor'}><rect x="2" y="4" width="20" height="5" rx="2"/><path d="M4 9v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9"/><path d="M10 13h4"/></Ico>;
const IcoUserPlus = (p) => <Ico size={p.size||16} stroke={p.stroke||'currentColor'}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></Ico>;
const IcoTrash    = (p) => <Ico size={p.size||16} stroke={p.stroke||'currentColor'}><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></Ico>;
const IcoRotate   = (p) => <Ico size={p.size||16} stroke={p.stroke||'currentColor'}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></Ico>;
const IcoKey      = (p) => <Ico size={p.size||16} stroke={p.stroke||'currentColor'}><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6M15.5 7.5l3 3L22 7l-3-3"/></Ico>;
const IcoGlobe    = (p) => <Ico size={p.size||16} stroke={p.stroke||'currentColor'}><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></Ico>;
const IcoMoon     = (p) => <Ico size={p.size||16} stroke={p.stroke||'currentColor'} d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>;

const iconBtn = { width: 32, height: 32, borderRadius: 6, display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'transparent', border: 'none', cursor: 'pointer' };

// ── Admin TopBar ───────────────────────────────────────────────
function AdminTopBar({ activeNav = 'Dashboard' }) {
  const navItems = ['Dashboard', 'Properties', 'Users', 'Landing'];
  return (
    <div style={{ position: 'sticky', top: 0, zIndex: 10 }}>
      <div style={{ height: 3, background: AMBER.line }}/>
      <div style={{ height: 64, background: 'rgba(255,255,255,0.8)', backdropFilter: 'blur(8px)', WebkitBackdropFilter: 'blur(8px)', borderBottom: `1px solid ${Zk.border}`, display: 'flex', alignItems: 'center', padding: '0 32px' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginRight: 12 }}>
          <div style={{ width: 26, height: 26, borderRadius: 6, background: Zk.foreground, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            <IcoLayoutDash size={15} stroke="#fff"/>
          </div>
          <span style={{ fontSize: 14.5, fontWeight: 600, letterSpacing: -0.1, color: Zk.foreground }}>UtilityBills</span>
        </div>
        <div style={{ display: 'inline-flex', alignItems: 'center', padding: '2px 8px', borderRadius: 9999, border: `1.5px solid ${AMBER.line}`, color: AMBER.solid, fontSize: 11, fontWeight: 600, letterSpacing: '0.04em', marginRight: 28, lineHeight: 1 }}>Admin</div>
        <nav style={{ display: 'flex', alignItems: 'center', gap: 4, flex: 1 }}>
          {navItems.map(item => {
            const active = item === activeNav;
            return (
              <a key={item} href="#" style={{ position: 'relative', padding: '8px 12px', fontSize: 13.5, fontWeight: active ? 500 : 400, color: active ? Zk.foreground : Zk.mutedFg, borderRadius: 6 }}>
                {item}
                {active && <span style={{ position: 'absolute', left: 12, right: 12, bottom: -1, height: 2, background: AMBER.solid, borderRadius: 2 }}/>}
              </a>
            );
          })}
        </nav>
        <button style={{ display: 'flex', alignItems: 'center', gap: 8, height: 36, padding: '0 4px 0 8px', background: 'transparent', border: 'none', borderRadius: 18, cursor: 'pointer' }}>
          <span style={{ fontSize: 13, color: Zk.foreground, fontWeight: 500 }}>Art Loban</span>
          <div style={{ width: 28, height: 28, borderRadius: '50%', background: AMBER.tintBg, color: AMBER.solid, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 11, fontWeight: 600, border: `1px solid ${AMBER.tintBorder}` }}>AL</div>
        </button>
      </div>
    </div>
  );
}

// ── Stat card ──────────────────────────────────────────────────
function StatCard({ IcoComp, iconColor, number, label }) {
  const clr = iconColor || Zk.mutedFg;
  return (
    <Kard style={{ padding: 24 }}>
      <div style={{ marginBottom: 20 }}><IcoComp size={20} stroke={clr}/></div>
      <div style={{ fontSize: 30, fontWeight: 600, letterSpacing: -0.6, fontFeatureSettings: '"tnum" 1', color: Zk.foreground, lineHeight: 1, marginBottom: 6 }}>{number}</div>
      <div style={{ fontSize: 13, color: Zk.mutedFg }}>{label}</div>
    </Kard>
  );
}

// ── Activity ───────────────────────────────────────────────────
const ACTIVITY = [
  { IcoComp: IcoUserPlus, bg: '#ede9fe', clr: '#7c3aed', action: 'New user joined',       detail: 'alex.kovalenko@example.com signed in with Google',                          time: '12 min ago'  },
  { IcoComp: IcoHome,     bg: Zk.muted,  clr: Zk.mutedFg,action: 'Property created',      detail: 'Olena Petrenko added "Summer cottage"',                                     time: '47 min ago'  },
  { IcoComp: IcoTrash,    bg: '#fee2e2', clr: '#dc2626', action: 'Property soft-deleted', detail: 'Mykhailo Tkachenko removed "Old apartment"',                                 time: '2 hr ago'    },
  { IcoComp: IcoReceipt,  bg: '#e0f2fe', clr: '#0284c7', action: 'Bill recorded',         detail: 'Art Loban recorded electricity bill for Main apartment',                    time: '3 hr ago'    },
  { IcoComp: IcoKey,      bg: AMBER.tintBg, clr: AMBER.solid, action: 'Sharing changed', detail: 'Olena Petrenko added Iryna Petrenko as editor on "Summer cottage"',          time: '5 hr ago'    },
  { IcoComp: IcoRotate,   bg: '#d1fae5', clr: '#059669', action: 'Property restored',     detail: 'Admin restored "Vacation house"',                                            time: 'yesterday'   },
  { IcoComp: IcoHome,     bg: Zk.muted,  clr: Zk.mutedFg,action: 'Property created',      detail: 'Iryna Shevchenko added "Studio downtown"',                                  time: 'yesterday'   },
  { IcoComp: IcoReceipt,  bg: '#e0f2fe', clr: '#0284c7', action: 'Bill recorded',         detail: 'Mykhailo Tkachenko recorded gas bill for Family home',                      time: '2 days ago'  },
];

function ActivityRow({ item, isLast }) {
  const [hover, setHover] = useLocalState(false);
  return (
    <div
      onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}
      style={{ display: 'flex', alignItems: 'center', gap: 14, padding: '14px 24px', borderBottom: isLast ? 'none' : `1px solid ${Zk.border}`, background: hover ? Zk.subtle : 'transparent', transition: 'background 120ms' }}
    >
      <div style={{ width: 32, height: 32, borderRadius: 8, background: item.bg, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
        <item.IcoComp size={15} stroke={item.clr}/>
      </div>
      <div style={{ flex: 1, minWidth: 0 }}>
        <span style={{ fontWeight: 500, color: Zk.foreground, fontSize: 13.5 }}>{item.action}</span>
        <span style={{ color: Zk.mutedFg, fontSize: 13.5 }}> — {item.detail}</span>
      </div>
      <span style={{ fontSize: 12.5, color: Zk.mutedFg, flexShrink: 0, whiteSpace: 'nowrap' }}>{item.time}</span>
    </div>
  );
}

// ── Page ───────────────────────────────────────────────────────
function AdminDashboard() {
  return (
    <div style={{ fontFamily: "'Inter', system-ui, sans-serif", fontFeatureSettings: '"cv11" 1, "ss01" 1', color: Zk.foreground, background: Zk.subtle, minHeight: '100vh', WebkitFontSmoothing: 'antialiased' }}>
      <AdminTopBar activeNav="Dashboard"/>
      <div style={{ maxWidth: 1360, margin: '0 auto', padding: '32px 32px 48px' }}>
        <div style={{ marginBottom: 28 }}>
          <h2 style={{ margin: 0, fontSize: 28, fontWeight: 600, letterSpacing: -0.6, color: Zk.foreground }}>Admin dashboard</h2>
          <p style={{ margin: '5px 0 0', fontSize: 13, color: Zk.mutedFg }}>System-wide overview.</p>
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4,1fr)', gap: 16, marginBottom: 28 }}>
          <StatCard IcoComp={IcoUsers}   number="12"    label="Total users"/>
          <StatCard IcoComp={IcoHome}    number="28"    label="Active properties"/>
          <StatCard IcoComp={IcoReceipt} number="1,847" label="Bills recorded"/>
          <StatCard IcoComp={IcoArchive} number="7"     label="Soft-deleted items" iconColor={AMBER.solid}/>
        </div>
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 10, marginBottom: 16 }}>
          <h3 style={{ margin: 0, fontSize: 14, fontWeight: 600, color: Zk.foreground, letterSpacing: -0.1 }}>Recent activity</h3>
          <span style={{ fontSize: 12, color: Zk.mutedFg }}>Last 20 actions across the system.</span>
        </div>
        <Kard style={{ padding: 0, overflow: 'hidden' }}>
          {ACTIVITY.map((item, i) => <ActivityRow key={i} item={item} isLast={i === ACTIVITY.length - 1}/>)}
        </Kard>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<AdminDashboard/>);
</script>
</body>
</html>
