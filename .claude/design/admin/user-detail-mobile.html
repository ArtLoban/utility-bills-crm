<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Utility Bills CRM — Admin: Olena Petrenko (mobile, light)</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #f4f4f5; }
  body { font-family: 'Inter', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  button { font-family: inherit; }
  a { text-decoration: none; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">

const useLocalState = React.useState;

// ── Tokens (light) ─────────────────────────────────────────────
const Zk = {
  background:'#ffffff', foreground:'#09090b', card:'#ffffff',
  muted:'#f4f4f5', mutedFg:'#71717a', mutedFg2:'#a1a1aa', border:'#e4e4e7',
  subtle:'#fafafa', destructive:'#dc2626', success:'#16a34a',
};
const AMBER  = { line:'#f59e0b', solid:'#d97706', tintBg:'#fef3c7', tintBorder:'#fde68a' };
const VIOLET = { solid:'#7c3aed', tintBg:'#f5f3ff', tintBorder:'#ede9fe' };
const GREEN  = { solid:'#059669', tintBg:'#ecfdf5' };

function Ico({ size=16, stroke='currentColor', d, fill='none', children }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill={fill}
      stroke={stroke} strokeWidth={1.75} strokeLinecap="round" strokeLinejoin="round">
      {d ? <path d={d}/> : children}
    </svg>
  );
}
function Kard({ children, style }) {
  return <div style={{ background:Zk.card, border:`1px solid ${Zk.border}`, borderRadius:8, boxShadow:'0 1px 2px 0 rgba(24,24,27,0.05)', ...style }}>{children}</div>;
}

// ── Icons ──────────────────────────────────────────────────────
const IcoLayoutDash = (p) => <Ico size={p.size||16} stroke={p.stroke||'currentColor'}><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></Ico>;
const IcoChevR    = (p) => <Ico size={p.size||13} stroke={p.stroke||Zk.mutedFg} d="m9 18 6-6-6-6"/>;
const IcoPine     = (p) => <Ico size={p.size||16} stroke={p.stroke||'currentColor'}><path d="m17 14 3 3.3a1 1 0 0 1-.7 1.7H4.7a1 1 0 0 1-.7-1.7L7 14h-.3a1 1 0 0 1-.7-1.7L9 9h-.2A1 1 0 0 1 8 7.3L12 3l4 4.3a1 1 0 0 1-.8 1.7H15l3 3.3a1 1 0 0 1-.7 1.7H17Z"/><path d="M12 22v-3"/></Ico>;
const IcoBuilding = (p) => <Ico size={p.size||16} stroke={p.stroke||'currentColor'}><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4M8 6h.01M16 6h.01M12 6h.01M12 10h.01M12 14h.01M16 10h.01M16 14h.01M8 10h.01M8 14h.01"/></Ico>;

function GoogleMark({ size=13 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 18 18" aria-hidden="true">
      <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.17-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/>
      <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.32A9 9 0 0 0 9 18z"/>
      <path fill="#FBBC05" d="M3.97 10.72A5.4 5.4 0 0 1 3.68 9c0-.6.1-1.18.29-1.72V4.96H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.04l3.01-2.32z"/>
      <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.96L3.97 7.28C4.68 5.16 6.66 3.58 9 3.58z"/>
    </svg>
  );
}

// ── Panel framing ──────────────────────────────────────────────
function PanelLabel({ view, url, extra }) {
  return (
    <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:8, paddingLeft:2 }}>
      <span style={{ fontSize:11, fontWeight:600, letterSpacing:'0.07em', textTransform:'uppercase', color:'#a1a1aa' }}>{view}</span>
      <code style={{ fontSize:11, background:'#e4e4e7', padding:'1px 6px', borderRadius:4, color:'#52525b', fontFamily:"'SF Mono','Fira Mono',monospace" }}>{url}</code>
      {extra && <span style={{ fontSize:11, color:'#a1a1aa' }}>· {extra}</span>}
    </div>
  );
}

// ── Admin TopBar (mobile) ──────────────────────────────────────
function AdminTopBarMobile({ activeNav='Users' }) {
  return (
    <div>
      <div style={{ height:3, background:AMBER.line }}/>
      <div style={{ height:52, background:'rgba(255,255,255,0.95)', borderBottom:`1px solid ${Zk.border}`, display:'flex', alignItems:'center', padding:'0 16px', gap:8 }}>
        <div style={{ width:24, height:24, borderRadius:6, background:Zk.foreground, display:'flex', alignItems:'center', justifyContent:'center' }}><IcoLayoutDash size={14} stroke="#fff"/></div>
        <span style={{ fontSize:14, fontWeight:600, letterSpacing:-0.1 }}>UtilityBills</span>
        <div style={{ display:'inline-flex', alignItems:'center', padding:'1px 7px', borderRadius:9999, border:`1.25px solid ${AMBER.line}`, color:AMBER.solid, fontSize:10, fontWeight:600, letterSpacing:'0.04em', lineHeight:1 }}>Admin</div>
        <div style={{ flex:1 }}/>
        <div style={{ width:26, height:26, borderRadius:'50%', background:AMBER.tintBg, color:AMBER.solid, display:'flex', alignItems:'center', justifyContent:'center', fontSize:10.5, fontWeight:600, border:`1px solid ${AMBER.tintBorder}` }}>AL</div>
      </div>
      <div style={{ display:'flex', borderBottom:`1px solid ${Zk.border}`, padding:'0 8px', background:'#fff', overflowX:'auto' }}>
        {['Dashboard','Properties','Users','Landing'].map(item => {
          const active = item === activeNav;
          return (
            <a key={item} href="#" style={{ position:'relative', padding:'10px 12px', fontSize:13, fontWeight:active?500:400, color:active?Zk.foreground:Zk.mutedFg, whiteSpace:'nowrap' }}>
              {item}
              {active && <span style={{ position:'absolute', left:12, right:12, bottom:-1, height:2, background:AMBER.solid, borderRadius:2 }}/>}
            </a>
          );
        })}
      </div>
    </div>
  );
}

// ── Stacked InfoList (mobile) ─────────────────────────────────
function InfoList({ rows }) {
  return (
    <div>
      {rows.map((row, i) => (
        <div key={i} style={{ padding:'12px 16px', borderTop: i === 0 ? 'none' : `1px solid ${Zk.border}` }}>
          <div style={{ fontSize:10.5, fontWeight:600, color:Zk.mutedFg, letterSpacing:'0.05em', textTransform:'uppercase', marginBottom:4 }}>{row.label}</div>
          <div style={{ fontSize:13.5, color:Zk.foreground, lineHeight:1.5, wordBreak: row.breakAll ? 'break-all' : 'normal' }}>{row.value}</div>
        </div>
      ))}
    </div>
  );
}

// ── Badges ─────────────────────────────────────────────────────
function UserBadge() {
  return (
    <span style={{ display:'inline-flex', alignItems:'center', padding:'1px 7px', borderRadius:9999, border:`1px solid ${Zk.border}`, fontSize:11, fontWeight:500, color:Zk.mutedFg, lineHeight:1.4, verticalAlign:'middle', whiteSpace:'nowrap', flexShrink:0 }}>User</span>
  );
}
function PropRoleBadge({ role }) {
  if (role === 'Owner') {
    return (
      <span style={{ display:'inline-flex', alignItems:'center', padding:'1.5px 7px', borderRadius:9999, background:VIOLET.tintBg, border:`1px solid ${VIOLET.tintBorder}`, fontSize:11, fontWeight:500, color:VIOLET.solid, lineHeight:1.4 }}>Owner</span>
    );
  }
  return (
    <span style={{ display:'inline-flex', alignItems:'center', padding:'1.5px 7px', borderRadius:9999, border:`1px solid ${Zk.border}`, fontSize:11, fontWeight:500, color:Zk.mutedFg, lineHeight:1.4 }}>{role}</span>
  );
}

// ── Mobile property row ────────────────────────────────────────
function PropertyRowMobile({ IcoComp, name, role, services, status, isLast }) {
  const statusClr = status === 'Active' ? GREEN.solid : Zk.mutedFg;
  return (
    <a href="#" style={{ display:'flex', alignItems:'center', gap:12, padding:'14px 16px', borderBottom: isLast ? 'none' : `1px solid ${Zk.border}` }}>
      <div style={{ width:34, height:34, borderRadius:8, background:VIOLET.tintBg, border:`1px solid ${VIOLET.tintBorder}`, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
        <IcoComp size={17} stroke={VIOLET.solid}/>
      </div>
      <div style={{ flex:1, minWidth:0 }}>
        <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:2 }}>
          <span style={{ fontSize:13.5, fontWeight:500, color:Zk.foreground, letterSpacing:-0.1 }}>{name}</span>
          <PropRoleBadge role={role}/>
        </div>
        <div style={{ fontSize:12, color:Zk.mutedFg }}>
          {services} services
          <span style={{ color:Zk.border, margin:'0 5px' }}>·</span>
          <span style={{ color:statusClr, fontWeight:500 }}>{status}</span>
        </div>
      </div>
      <IcoChevR size={14} stroke={Zk.mutedFg2}/>
    </a>
  );
}

// ── Avatar ─────────────────────────────────────────────────────
function UserAvatar({ size=32, initials='OP' }) {
  const fs = size <= 32 ? 12 : 14;
  return (
    <div style={{ width:size, height:size, borderRadius:'50%', background:VIOLET.tintBg, border:`1px solid ${VIOLET.tintBorder}`, color:VIOLET.solid, display:'inline-flex', alignItems:'center', justifyContent:'center', fontSize:fs, fontWeight:600, flexShrink:0 }}>
      {initials}
    </div>
  );
}

// ── Mobile page ────────────────────────────────────────────────
function MobileDetail() {
  return (
    <div style={{ background:Zk.subtle, minHeight:'100%', fontFamily:"'Inter',system-ui,sans-serif", fontFeatureSettings:'"cv11" 1,"ss01" 1', color:Zk.foreground }}>
      <AdminTopBarMobile activeNav="Users"/>

      <div style={{ padding:'16px 16px 24px' }}>

        {/* Breadcrumbs */}
        <div style={{ display:'flex', alignItems:'center', gap:5, fontSize:12, color:Zk.mutedFg, marginBottom:14, flexWrap:'wrap' }}>
          <a href="#" style={{ color:Zk.mutedFg }}>art-admin</a>
          <IcoChevR size={11}/>
          <a href="#" style={{ color:Zk.mutedFg }}>users</a>
          <IcoChevR size={11}/>
          <span style={{ color:Zk.foreground }}>Olena Petrenko</span>
        </div>

        {/* Page header */}
        <div style={{ marginBottom:20 }}>
          <h1 style={{ margin:0, fontSize:22, fontWeight:600, letterSpacing:-0.4, color:Zk.foreground, lineHeight:1.2 }}>Olena Petrenko</h1>
          <div style={{ marginTop:8, fontSize:12.5, color:Zk.mutedFg, lineHeight:1.6, wordBreak:'break-word' }}>
            <div>olena.petrenko@example.com</div>
            <div style={{ marginTop:4, display:'flex', alignItems:'center', gap:8, flexWrap:'wrap' }}>
              <UserBadge/>
              <span style={{ color:Zk.border }}>·</span>
              <span>Joined April 2024</span>
            </div>
          </div>
        </div>

        {/* Card 1 — User info */}
        <Kard style={{ padding:0, overflow:'hidden', marginBottom:12 }}>
          <div style={{ padding:'14px 16px', borderBottom:`1px solid ${Zk.border}` }}>
            <h3 style={{ margin:0, fontSize:13.5, fontWeight:600, color:Zk.foreground, letterSpacing:-0.1 }}>User info</h3>
          </div>
          <InfoList rows={[
            { label:'Email',         value:'olena.petrenko@example.com', breakAll:true },
            { label:'Name',          value:'Olena Petrenko' },
            { label:'System role',   value:'User' },
            { label:'Created',       value:'April 12, 2024' },
            { label:'Last login',    value:'1 hour ago' },
            { label:'Auth provider', value:(
              <span style={{ display:'inline-flex', alignItems:'center', gap:6 }}>
                <GoogleMark size={13}/> Google
              </span>
            )},
            { label:'Avatar', value:(
              <div style={{ display:'flex', alignItems:'center', gap:10, marginTop:2 }}>
                <UserAvatar size={32} initials="OP"/>
                <span style={{ fontSize:12, color:Zk.mutedFg }}>From Google</span>
              </div>
            )},
          ]}/>
        </Kard>

        {/* Card 2 — Properties */}
        <Kard style={{ padding:0, overflow:'hidden', marginBottom:12 }}>
          <div style={{ padding:'14px 16px', borderBottom:`1px solid ${Zk.border}` }}>
            <h3 style={{ margin:0, fontSize:13.5, fontWeight:600, color:Zk.foreground, letterSpacing:-0.1 }}>Properties</h3>
            <p style={{ margin:'3px 0 0', fontSize:12, color:Zk.mutedFg }}>2 properties accessible to this user.</p>
          </div>
          <PropertyRowMobile IcoComp={IcoPine}     name="Summer cottage" role="Owner" services={2} status="Active" isLast={false}/>
          <PropertyRowMobile IcoComp={IcoBuilding} name="Sea-view condo" role="Owner" services={3} status="Active" isLast={true}/>
        </Kard>

        {/* Audit info */}
        <div style={{ paddingTop:18, marginTop:6, borderTop:`1px solid ${Zk.border}` }}>
          <div style={{ fontFamily:"'SF Mono','Fira Mono','Courier New',monospace", fontSize:11.5, color:Zk.mutedFg, marginBottom:3, wordBreak:'break-all' }}>User ID: usr_8nQpL3kMtYx2vBcZdR5h</div>
          <div style={{ fontSize:11.5, color:Zk.mutedFg }}>Internal record. For support reference only.</div>
        </div>

      </div>
    </div>
  );
}

// ── Root ───────────────────────────────────────────────────────
function Screen() {
  return (
    <div style={{ fontFamily:"'Inter',system-ui,sans-serif", fontFeatureSettings:'"cv11" 1,"ss01" 1', WebkitFontSmoothing:'antialiased', color:Zk.foreground, padding:'40px 24px 56px', minHeight:'100vh' }}>
      <div style={{ display:'flex', justifyContent:'center' }}>
        <div>
          <PanelLabel view="Admin view · mobile" url="/art-admin/users/[id]" extra="390 × auto"/>
          <div style={{ width:390, background:Zk.background, borderRadius:24, overflow:'hidden', border:`1px solid ${Zk.border}`, boxShadow:'0 2px 16px -4px rgba(0,0,0,0.1), 0 1px 4px -2px rgba(0,0,0,0.06)' }}>
            <MobileDetail/>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Screen/>);
</script>
</body>
</html>
