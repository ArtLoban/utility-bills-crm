<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Utility Bills CRM — Properties Comparison</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #f4f4f5; }
  body { font-family: 'Inter', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  button, input { font-family: inherit; }
  a { text-decoration: none; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">

const useLocalState = React.useState;

const Zk = {
  background: '#ffffff', foreground: '#09090b', card: '#ffffff',
  muted: '#f4f4f5', mutedFg: '#71717a', border: '#e4e4e7',
  subtle: '#fafafa', destructive: '#dc2626', success: '#16a34a',
};
const VIOLET = { solid: '#7c3aed', tintBg: '#f5f3ff', tintBorder: '#ede9fe' };
const AMBER  = { line: '#f59e0b', solid: '#d97706', tintBg: '#fef3c7', tintBorder: '#fde68a' };

function Ico({ size = 16, stroke = 'currentColor', d, fill = 'none', children }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill={fill}
      stroke={stroke} strokeWidth={1.75} strokeLinecap="round" strokeLinejoin="round">
      {d ? <path d={d}/> : children}
    </svg>
  );
}
function Kard({ children, style }) {
  return <div style={{ background: Zk.card, border: `1px solid ${Zk.border}`, borderRadius: 8, boxShadow: '0 1px 2px 0 rgba(24,24,27,0.05)', ...style }}>{children}</div>;
}

// Icons
const IcoLayoutDash = (p) => <Ico size={p.size||16} stroke={p.stroke||'currentColor'}><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></Ico>;
const IcoHome      = (p) => <Ico size={p.size||16} stroke={p.stroke||'currentColor'}><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></Ico>;
const IcoPine      = (p) => <Ico size={p.size||16} stroke={p.stroke||'currentColor'}><path d="m17 14 3 3.3a1 1 0 0 1-.7 1.7H4.7a1 1 0 0 1-.7-1.7L7 14h-.3a1 1 0 0 1-.7-1.7L9 9h-.2A1 1 0 0 1 8 7.3L12 3l4 4.3a1 1 0 0 1-.8 1.7H15l3 3.3a1 1 0 0 1-.7 1.7H17Z"/><path d="M12 22v-3"/></Ico>;
const IcoBuilding  = (p) => <Ico size={p.size||16} stroke={p.stroke||'currentColor'}><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4M8 6h.01M16 6h.01M12 6h.01M12 10h.01M12 14h.01M16 10h.01M16 14h.01M8 10h.01M8 14h.01"/></Ico>;
const IcoChevR     = (p) => <Ico size={p.size||13} stroke={p.stroke||Zk.border} d="m9 18 6-6-6-6"/>;
const IcoChevD     = (p) => <Ico size={p.size||14} stroke={p.stroke||Zk.mutedFg} d="m6 9 6 6 6-6"/>;
const IcoUsers     = (p) => <Ico size={p.size||16} stroke={p.stroke||'currentColor'}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></Ico>;
const IcoGlobe     = (p) => <Ico size={p.size||16} stroke={p.stroke||'currentColor'}><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></Ico>;
const IcoMoon      = (p) => <Ico size={p.size||16} stroke={p.stroke||'currentColor'} d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>;
const IcoMoreV     = (p) => <Ico size={p.size||14} stroke={p.stroke||'currentColor'}><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></Ico>;
const IcoEye       = (p) => <Ico size={p.size||13} stroke={p.stroke||'currentColor'}><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></Ico>;
const IcoRotate    = (p) => <Ico size={p.size||13} stroke={p.stroke||'currentColor'}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></Ico>;
const IcoTrash     = (p) => <Ico size={p.size||13} stroke={p.stroke||'currentColor'}><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></Ico>;

const iconBtn = { width: 32, height: 32, borderRadius: 6, display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'transparent', border: 'none', cursor: 'pointer' };

// ── Panel helpers ──────────────────────────────────────────────
function PanelLabel({ view, url }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 8, paddingLeft: 2 }}>
      <span style={{ fontSize: 11, fontWeight: 600, letterSpacing: '0.07em', textTransform: 'uppercase', color: '#a1a1aa' }}>{view}</span>
      <code style={{ fontSize: 11, background: '#e4e4e7', padding: '1px 6px', borderRadius: 4, color: '#52525b', fontFamily: "'SF Mono','Fira Mono',monospace" }}>{url}</code>
    </div>
  );
}
function PanelFrame({ children }) {
  return <div style={{ background: Zk.background, borderRadius: 12, overflow: 'hidden', boxShadow: '0 2px 16px -4px rgba(0,0,0,0.1), 0 1px 4px -2px rgba(0,0,0,0.06)' }}>{children}</div>;
}

// ── User TopBar ────────────────────────────────────────────────
function UserTopBar() {
  return (
    <div style={{ height: 64, background: 'rgba(255,255,255,0.95)', borderBottom: `1px solid ${Zk.border}`, display: 'flex', alignItems: 'center', padding: '0 32px' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginRight: 40 }}>
        <div style={{ width: 26, height: 26, borderRadius: 6, background: VIOLET.solid, display: 'flex', alignItems: 'center', justifyContent: 'center' }}><IcoLayoutDash size={15} stroke="#fff"/></div>
        <span style={{ fontSize: 14.5, fontWeight: 600, letterSpacing: -0.1, color: Zk.foreground }}>UtilityBills</span>
      </div>
      <nav style={{ display: 'flex', alignItems: 'center', gap: 4, flex: 1 }}>
        {['Dashboard','Properties','Bills','Payments','Settings'].map(item => {
          const active = item === 'Properties';
          return <a key={item} href="#" style={{ position: 'relative', padding: '8px 12px', fontSize: 13.5, fontWeight: active ? 500 : 400, color: active ? Zk.foreground : Zk.mutedFg, borderRadius: 6 }}>{item}{active && <span style={{ position: 'absolute', left: 12, right: 12, bottom: -1, height: 2, background: VIOLET.solid, borderRadius: 2 }}/>}</a>;
        })}
      </nav>
      <div style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
        <button style={iconBtn}><IcoGlobe size={16} stroke={Zk.mutedFg}/></button>
        <button style={iconBtn}><IcoMoon size={16} stroke={Zk.mutedFg}/></button>
        <div style={{ width: 1, height: 20, background: Zk.border, margin: '0 8px' }}/>
        <button style={{ display: 'flex', alignItems: 'center', gap: 8, height: 36, padding: '0 4px 0 8px', background: 'transparent', border: 'none', cursor: 'pointer' }}>
          <span style={{ fontSize: 13, color: Zk.foreground, fontWeight: 500 }}>Art Loban</span>
          <div style={{ width: 28, height: 28, borderRadius: '50%', background: VIOLET.tintBg, color: VIOLET.solid, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 11, fontWeight: 600, border: `1px solid ${VIOLET.tintBorder}` }}>AL</div>
        </button>
      </div>
    </div>
  );
}

// ── Admin TopBar ───────────────────────────────────────────────
function AdminTopBar() {
  return (
    <>
      <div style={{ height: 3, background: AMBER.line }}/>
      <div style={{ height: 64, background: 'rgba(255,255,255,0.95)', borderBottom: `1px solid ${Zk.border}`, display: 'flex', alignItems: 'center', padding: '0 32px' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginRight: 12 }}>
          <div style={{ width: 26, height: 26, borderRadius: 6, background: Zk.foreground, display: 'flex', alignItems: 'center', justifyContent: 'center' }}><IcoLayoutDash size={15} stroke="#fff"/></div>
          <span style={{ fontSize: 14.5, fontWeight: 600, letterSpacing: -0.1, color: Zk.foreground }}>UtilityBills</span>
        </div>
        <div style={{ display: 'inline-flex', alignItems: 'center', padding: '2px 8px', borderRadius: 9999, border: `1.5px solid ${AMBER.line}`, color: AMBER.solid, fontSize: 11, fontWeight: 600, letterSpacing: '0.04em', marginRight: 28, lineHeight: 1 }}>Admin</div>
        <nav style={{ display: 'flex', alignItems: 'center', gap: 4, flex: 1 }}>
          {['Dashboard','Properties','Users','Landing'].map(item => {
            const active = item === 'Properties';
            return <a key={item} href="#" style={{ position: 'relative', padding: '8px 12px', fontSize: 13.5, fontWeight: active ? 500 : 400, color: active ? Zk.foreground : Zk.mutedFg, borderRadius: 6 }}>{item}{active && <span style={{ position: 'absolute', left: 12, right: 12, bottom: -1, height: 2, background: AMBER.solid, borderRadius: 2 }}/>}</a>;
          })}
        </nav>
        <button style={{ display: 'flex', alignItems: 'center', gap: 8, height: 36, padding: '0 4px 0 8px', background: 'transparent', border: 'none', cursor: 'pointer' }}>
          <span style={{ fontSize: 13, color: Zk.foreground, fontWeight: 500 }}>Art Loban</span>
          <div style={{ width: 28, height: 28, borderRadius: '50%', background: AMBER.tintBg, color: AMBER.solid, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 11, fontWeight: 600, border: `1px solid ${AMBER.tintBorder}` }}>AL</div>
        </button>
      </div>
    </>
  );
}

// ── User property card ─────────────────────────────────────────
const USER_PROPS = [
  { type: 'apartment', name: 'Main apartment',  addr: 'Velyka Vasylkivska 142, apt 7', svc: 4, bal: -2184 },
  { type: 'cottage',   name: 'Summer cottage',  addr: 'Kyiv region, Boryspil',         svc: 2, bal:  0    },
  { type: 'house',     name: 'Family home',     addr: 'Lviv, Shevchenka 3',            svc: 5, bal:  350, shared: true, role: 'Editor' },
  { type: 'apartment', name: 'Studio downtown', addr: 'Khreshchatyk 22, apt 3',        svc: 3, bal: -1420 },
];

function UserPropCard({ p }) {
  const [hover, setHover] = useLocalState(false);
  const TypeIco = p.type === 'cottage' ? IcoPine : p.type === 'house' ? IcoHome : IcoBuilding;
  const balColor = p.bal < 0 ? Zk.destructive : p.bal > 0 ? Zk.success : Zk.mutedFg;
  const balText = p.bal === 0 ? '0 UAH' : `${p.bal < 0 ? '−' : '+'}${Math.abs(p.bal).toLocaleString()} UAH`;
  return (
    <a href="#" onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}
      style={{ display: 'block', background: Zk.card, border: `1px solid ${Zk.border}`, borderRadius: 8, padding: 24, boxShadow: hover ? '0 4px 8px -2px rgba(24,24,27,.08)' : '0 1px 2px 0 rgba(24,24,27,.05)', transition: 'box-shadow 150ms, transform 150ms', transform: hover ? 'translateY(-1px)' : 'translateY(0)' }}>
      <div style={{ display: 'flex', alignItems: 'flex-start', gap: 12, marginBottom: 4 }}>
        <div style={{ width: 40, height: 40, borderRadius: 8, background: VIOLET.tintBg, border: `1px solid ${VIOLET.tintBorder}`, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
          <TypeIco size={20} stroke={VIOLET.solid}/>
        </div>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontSize: 15, fontWeight: 600, color: Zk.foreground, letterSpacing: -0.2, marginBottom: 2 }}>{p.name}</div>
          <div style={{ fontSize: 12.5, color: Zk.mutedFg }}>{p.addr}</div>
        </div>
      </div>
      <div style={{ marginTop: 16, paddingTop: 16, borderTop: `1px solid ${Zk.border}`, display: 'flex', alignItems: 'center', gap: 10 }}>
        <span style={{ fontSize: 12.5, color: Zk.mutedFg }}>{p.svc} services</span>
        {p.shared && <><span style={{ color: Zk.border }}>·</span><span style={{ display: 'inline-flex', alignItems: 'center', gap: 4, fontSize: 11, fontWeight: 500, padding: '2px 8px', background: Zk.muted, color: Zk.foreground, borderRadius: 999 }}><IcoUsers size={11} stroke={Zk.foreground}/> Shared</span><span style={{ fontSize: 12, color: Zk.mutedFg }}>· {p.role}</span></>}
      </div>
      <div style={{ marginTop: 16, paddingTop: 16, borderTop: `1px solid ${Zk.border}`, display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between' }}>
        <div>
          <div style={{ fontSize: 11, color: Zk.mutedFg, fontWeight: 500, textTransform: 'uppercase', letterSpacing: 0.3, marginBottom: 4 }}>Balance</div>
          <div style={{ fontSize: 20, fontWeight: 600, color: balColor, letterSpacing: -0.3, fontFeatureSettings: '"tnum" 1' }}>{balText}</div>
        </div>
        <span style={{ fontSize: 13, fontWeight: 500, color: hover ? VIOLET.solid : Zk.mutedFg, transition: 'color 120ms', display: 'flex', alignItems: 'center', gap: 4 }}>
          Open <IcoChevR size={14} stroke={hover ? VIOLET.solid : Zk.mutedFg}/>
        </span>
      </div>
    </a>
  );
}

// ── Admin table rows ───────────────────────────────────────────
const ADMIN_PROPS = [
  { name: 'Main apartment',  owner: 'Art Loban',          type: 'Apartment', status: 'active',  svc: 4, created: 'Mar 2024' },
  { name: 'Summer cottage',  owner: 'Olena Petrenko',     type: 'Cottage',   status: 'active',  svc: 2, created: 'Apr 2024' },
  { name: 'Old apartment',   owner: 'Mykhailo Tkachenko', type: 'Apartment', status: 'deleted', svc: 3, created: 'Jan 2024', menuOpen: true },
  { name: 'Family home',     owner: 'Iryna Shevchenko',   type: 'House',     status: 'active',  svc: 5, created: 'Jun 2024', extra: '+1' },
  { name: 'Studio downtown', owner: 'Bohdan Kovalenko',   type: 'Apartment', status: 'active',  svc: 3, created: 'Aug 2025' },
  { name: 'Vacation house',  owner: 'Kateryna Lysenko',   type: 'House',     status: 'deleted', svc: 4, created: 'Feb 2024' },
  { name: 'Sea-view condo',  owner: 'Olena Petrenko',     type: 'Apartment', status: 'active',  svc: 3, created: 'Sep 2025' },
  { name: 'Forest cabin',    owner: 'Mykhailo Tkachenko', type: 'Cottage',   status: 'active',  svc: 2, created: 'Oct 2024' },
];

function AdminRow({ row, isLast }) {
  const [hover, setHover] = useLocalState(false);
  const del = row.status === 'deleted';
  const cell = { padding: '11px 16px', borderBottom: isLast ? 'none' : `1px solid ${Zk.border}`, fontSize: 13 };
  return (
    <tr onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}
      style={{ opacity: del ? 0.6 : 1, background: hover ? Zk.subtle : 'transparent', transition: 'background 120ms' }}>
      <td style={{ ...cell, fontWeight: 500, color: Zk.foreground, textDecoration: del ? 'line-through' : 'none', textDecorationColor: Zk.mutedFg }}>{row.name}</td>
      <td style={{ ...cell, color: Zk.mutedFg }}>{row.owner}{row.extra && <span style={{ color: Zk.border, marginLeft: 2, fontSize: 12 }}>({row.extra})</span>}</td>
      <td style={{ ...cell, color: Zk.mutedFg }}>{row.type}</td>
      <td style={cell}>
        {del
          ? <span style={{ display:'inline-flex', alignItems:'center', padding:'2px 8px', borderRadius:9999, border:`1px solid ${Zk.border}`, fontSize:11.5, fontWeight:500, color:Zk.mutedFg }}>Deleted</span>
          : <span style={{ display:'inline-flex', alignItems:'center', padding:'2px 8px', borderRadius:9999, background:'#ecfdf5', fontSize:11.5, fontWeight:500, color:'#059669' }}>Active</span>}
      </td>
      <td style={{ ...cell, textAlign:'right', color:Zk.mutedFg, fontFeatureSettings:'"tnum" 1' }}>{row.svc}</td>
      <td style={{ ...cell, color:Zk.mutedFg }}>{row.created}</td>
      <td style={{ ...cell, position:'relative' }}>
        <button style={{ display:'flex', alignItems:'center', justifyContent:'center', width:28, height:28, borderRadius:6, border:`1px solid ${Zk.border}`, background: row.menuOpen ? Zk.muted : Zk.background, cursor:'pointer' }}>
          <IcoMoreV size={14} stroke={Zk.mutedFg}/>
        </button>
        {row.menuOpen && (
          <div style={{ position:'absolute', right:12, top:40, background:Zk.card, border:`1px solid ${Zk.border}`, borderRadius:8, boxShadow:'0 8px 24px rgba(0,0,0,0.12)', minWidth:172, zIndex:5, overflow:'hidden' }}>
            {[['View details',IcoEye,Zk.foreground],['Restore',IcoRotate,Zk.foreground],['Delete permanently',IcoTrash,Zk.destructive]].map(([label,IcoC,clr],i,arr) => (
              <div key={label} style={{ display:'flex', alignItems:'center', gap:8, padding:'8px 12px', fontSize:13, color:clr, cursor:'pointer', borderBottom:i<arr.length-1?`1px solid ${Zk.border}`:'none' }}>
                <IcoC size={13} stroke={clr}/> {label}
              </div>
            ))}
          </div>
        )}
      </td>
    </tr>
  );
}

function FilterPill({ label }) {
  return (
    <button style={{ display:'inline-flex', alignItems:'center', gap:6, height:32, padding:'0 10px 0 12px', background:Zk.background, border:`1px solid ${Zk.border}`, borderRadius:6, fontSize:13, color:Zk.foreground, cursor:'pointer' }}>
      {label} <IcoChevD size={14} stroke={Zk.mutedFg}/>
    </button>
  );
}

// ── Root ───────────────────────────────────────────────────────
function Comparison() {
  return (
    <div style={{ fontFamily:"'Inter',system-ui,sans-serif", fontFeatureSettings:'"cv11" 1,"ss01" 1', WebkitFontSmoothing:'antialiased', background:'#f4f4f5', minHeight:'100vh', padding:'40px 40px 56px', color:Zk.foreground }}>

      <PanelLabel view="User view" url="/properties"/>
      <PanelFrame>
        <UserTopBar/>
        <div style={{ maxWidth:1360, margin:'0 auto', padding:'32px 32px 40px' }}>
          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:28 }}>
            <h2 style={{ margin:0, fontSize:28, fontWeight:600, letterSpacing:-0.6 }}>My Properties</h2>
            <button style={{ display:'inline-flex', alignItems:'center', gap:6, height:36, padding:'0 16px', background:VIOLET.solid, color:'#fff', border:'none', borderRadius:6, fontSize:13.5, fontWeight:500, cursor:'pointer' }}>
              + Add property
            </button>
          </div>
          <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:20 }}>
            {USER_PROPS.map((p,i) => <UserPropCard key={i} p={p}/>)}
          </div>
        </div>
      </PanelFrame>

      <div style={{ display:'flex', alignItems:'center', gap:16, margin:'28px 0' }}>
        <div style={{ flex:1, height:1, background:'#d4d4d8' }}/>
        <span style={{ fontSize:11, fontWeight:600, letterSpacing:'0.07em', textTransform:'uppercase', color:'#a1a1aa' }}>same data · different product</span>
        <div style={{ flex:1, height:1, background:'#d4d4d8' }}/>
      </div>

      <PanelLabel view="Admin view" url="/art-admin/properties"/>
      <PanelFrame>
        <AdminTopBar/>
        <div style={{ maxWidth:1360, margin:'0 auto', padding:'32px 32px 40px' }}>
          <div style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between', marginBottom:24 }}>
            <div>
              <h2 style={{ margin:0, fontSize:28, fontWeight:600, letterSpacing:-0.6 }}>All properties</h2>
              <p style={{ margin:'5px 0 0', fontSize:13, color:Zk.mutedFg }}>28 active · 7 soft-deleted</p>
            </div>
            <div style={{ display:'flex', alignItems:'center', gap:8 }}>
              <FilterPill label="Owner: All"/><FilterPill label="Status: All"/><FilterPill label="Type: All"/>
            </div>
          </div>
          <Kard style={{ padding:0, overflow:'hidden' }}>
            <table style={{ width:'100%', borderCollapse:'collapse' }}>
              <thead>
                <tr style={{ background:Zk.muted }}>
                  {['Name','Owner(s)','Type','Status','Svc','Created',''].map((h,i) => (
                    <th key={i} style={{ padding:'10px 16px', textAlign:i===4?'right':'left', fontSize:11.5, fontWeight:600, color:Zk.mutedFg, letterSpacing:'0.03em', borderBottom:`1px solid ${Zk.border}`, whiteSpace:'nowrap' }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {ADMIN_PROPS.map((row,i) => <AdminRow key={i} row={row} isLast={i===ADMIN_PROPS.length-1}/>)}
              </tbody>
            </table>
          </Kard>
        </div>
      </PanelFrame>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Comparison/>);
</script>
</body>
</html>
