<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Utility Bills CRM — Hard Delete Modal</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #fafafa; }
  body { font-family: 'Inter', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  button, input { font-family: inherit; }
  a { text-decoration: none; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">

const Zk = {
  background:'#ffffff', foreground:'#09090b', card:'#ffffff',
  muted:'#f4f4f5', mutedFg:'#71717a', border:'#e4e4e7',
  subtle:'#fafafa', destructive:'#dc2626',
};
const AMBER = { line:'#f59e0b', solid:'#d97706', tintBg:'#fef3c7', tintBorder:'#fde68a' };

function Ico({ size=16, stroke='currentColor', d, fill='none', children }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill={fill}
      stroke={stroke} strokeWidth={1.75} strokeLinecap="round" strokeLinejoin="round">
      {d ? <path d={d}/> : children}
    </svg>
  );
}

const IcoLayoutDash    = (p) => <Ico size={p.size||16} stroke={p.stroke||'currentColor'}><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></Ico>;
const IcoTrash         = (p) => <Ico size={p.size||16} stroke={p.stroke||'currentColor'}><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></Ico>;
const IcoRotate        = (p) => <Ico size={p.size||16} stroke={p.stroke||'currentColor'}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></Ico>;
const IcoAlertTriangle = (p) => <Ico size={p.size||20} stroke={p.stroke||'currentColor'}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3z"/><path d="M12 9v4"/><path d="M12 17h.01"/></Ico>;
const IcoCheck         = (p) => <Ico size={p.size||16} stroke={p.stroke||'currentColor'} d="M20 6 9 17l-5-5"/>;
const IcoChevR         = (p) => <Ico size={p.size||13} stroke={p.stroke||Zk.border} d="m9 18 6-6-6-6"/>;

// ── Background page (dimmed admin detail) ──────────────────────
function BgPage() {
  return (
    <div style={{ filter:'blur(2px)', opacity:0.4, pointerEvents:'none', userSelect:'none', position:'fixed', inset:0, overflow:'hidden', background:Zk.subtle }}>
      <div style={{ height:3, background:AMBER.line }}/>
      <div style={{ height:64, background:'rgba(255,255,255,0.8)', borderBottom:`1px solid ${Zk.border}`, display:'flex', alignItems:'center', padding:'0 32px' }}>
        <div style={{ display:'flex', alignItems:'center', gap:8, marginRight:12 }}>
          <div style={{ width:26, height:26, borderRadius:6, background:Zk.foreground, display:'flex', alignItems:'center', justifyContent:'center' }}><IcoLayoutDash size={15} stroke="#fff"/></div>
          <span style={{ fontSize:14.5, fontWeight:600, letterSpacing:-0.1, color:Zk.foreground }}>UtilityBills</span>
        </div>
        <div style={{ display:'inline-flex', alignItems:'center', padding:'2px 8px', borderRadius:9999, border:`1.5px solid ${AMBER.line}`, color:AMBER.solid, fontSize:11, fontWeight:600, marginRight:28 }}>Admin</div>
        <nav style={{ display:'flex', gap:4, flex:1 }}>
          {['Dashboard','Properties','Users','Landing'].map(item => {
            const active = item==='Properties';
            return <span key={item} style={{ position:'relative', padding:'8px 12px', fontSize:13.5, fontWeight:active?500:400, color:active?Zk.foreground:Zk.mutedFg }}>{item}{active&&<span style={{ position:'absolute', left:12, right:12, bottom:-1, height:2, background:AMBER.solid, borderRadius:2 }}/>}</span>;
          })}
        </nav>
        <div style={{ display:'flex', alignItems:'center', gap:8 }}>
          <span style={{ fontSize:13, fontWeight:500, color:Zk.foreground }}>Art Loban</span>
          <div style={{ width:28, height:28, borderRadius:'50%', background:AMBER.tintBg, color:AMBER.solid, display:'flex', alignItems:'center', justifyContent:'center', fontSize:11, fontWeight:600, border:`1px solid ${AMBER.tintBorder}` }}>AL</div>
        </div>
      </div>
      <div style={{ maxWidth:900, margin:'0 auto', padding:'32px 32px' }}>
        <div style={{ display:'flex', alignItems:'center', gap:6, fontSize:13, color:Zk.mutedFg, marginBottom:20 }}>
          <span>art-admin</span><IcoChevR/><span>properties</span><IcoChevR/><span style={{ color:Zk.foreground }}>Old apartment</span>
        </div>
        <div style={{ display:'flex', alignItems:'flex-start', gap:14, padding:'16px 20px', background:'#fef2f2', border:'1px solid #fecaca', borderLeft:`4px solid ${Zk.destructive}`, borderRadius:8, marginBottom:24 }}>
          <IcoTrash size={18} stroke={Zk.destructive}/>
          <div style={{ flex:1 }}>
            <div style={{ fontSize:14, fontWeight:600, color:'#7f1d1d', marginBottom:3 }}>This property is soft-deleted</div>
            <p style={{ margin:0, fontSize:13, color:'#991b1b' }}>Soft-deleted on March 12, 2026. The owner sees this property as gone.</p>
          </div>
          <div style={{ display:'flex', gap:8, flexShrink:0 }}>
            <div style={{ display:'inline-flex', alignItems:'center', gap:6, height:32, padding:'0 12px', background:Zk.background, border:`1px solid ${Zk.border}`, borderRadius:6, fontSize:13, fontWeight:500 }}><IcoRotate size={13} stroke={Zk.foreground}/> Restore</div>
            <div style={{ display:'inline-flex', alignItems:'center', gap:6, height:32, padding:'0 12px', background:Zk.destructive, borderRadius:6, fontSize:13, fontWeight:500, color:'#fff' }}><IcoTrash size={13} stroke="#fff"/> Delete permanently</div>
          </div>
        </div>
        <h1 style={{ margin:'0 0 6px', fontSize:28, fontWeight:600, letterSpacing:-0.6, opacity:0.65, textDecoration:'line-through', textDecorationColor:Zk.mutedFg }}>Old apartment</h1>
        <p style={{ margin:'0 0 24px', fontSize:13.5, color:Zk.mutedFg }}>Apartment · Kyiv, Velyka Vasylkivska 142, apt 7 · 3 services</p>
        <div style={{ height:200, background:Zk.card, border:`1px solid ${Zk.border}`, borderRadius:8, marginBottom:16 }}/>
        <div style={{ height:140, background:Zk.card, border:`1px solid ${Zk.border}`, borderRadius:8 }}/>
      </div>
    </div>
  );
}

// ── Dialog ─────────────────────────────────────────────────────
function Dialog() {
  return (
    <div style={{ position:'fixed', inset:0, display:'flex', alignItems:'center', justifyContent:'center', zIndex:50, padding:24 }}>
      <div style={{ position:'absolute', inset:0, background:'rgba(9,9,11,0.5)' }}/>
      <div style={{ position:'relative', zIndex:1, width:'100%', maxWidth:448, background:Zk.card, borderRadius:12, border:`1px solid ${Zk.border}`, boxShadow:'0 25px 50px -12px rgba(0,0,0,0.28), 0 10px 20px -8px rgba(0,0,0,0.16)', overflow:'hidden' }}>

        {/* Header */}
        <div style={{ display:'flex', alignItems:'flex-start', gap:12, padding:'20px 24px 16px', borderBottom:`1px solid ${Zk.border}` }}>
          <div style={{ marginTop:1, flexShrink:0 }}><IcoAlertTriangle size={20} stroke={Zk.destructive}/></div>
          <h2 style={{ margin:0, fontSize:16, fontWeight:700, color:Zk.foreground, letterSpacing:-0.2, lineHeight:1.3 }}>Delete property permanently</h2>
        </div>

        {/* Body */}
        <div style={{ padding:'20px 24px', display:'flex', flexDirection:'column', gap:16 }}>
          <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
            <p style={{ margin:0, fontSize:13.5, color:Zk.foreground, lineHeight:1.6 }}>
              You're about to permanently delete <strong>Old apartment</strong> (owned by Mykhailo Tkachenko). This deletes 3 services, 47 readings, 18 bills, and 14 payments forever.
            </p>
            <p style={{ margin:0, fontSize:13.5, color:Zk.mutedFg, lineHeight:1.6 }}>
              External files (if any) won't be touched — we don't own them.
            </p>
            <p style={{ margin:0, fontSize:13.5, fontWeight:600, color:Zk.destructive, lineHeight:1.4 }}>
              This cannot be undone.
            </p>
          </div>

          <div style={{ height:1, background:Zk.border }}/>

          <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
            <label style={{ fontSize:13.5, color:Zk.foreground }}>
              To confirm, type{' '}
              <code style={{ fontFamily:"'SF Mono','Fira Mono','Courier New',monospace", fontSize:12.5, background:Zk.muted, padding:'1px 5px', borderRadius:4 }}>DELETE</code>
              {' '}below.
            </label>
            <div style={{ position:'relative' }}>
              <input type="text" defaultValue="DELETE" readOnly style={{ width:'100%', padding:'8px 36px 8px 12px', borderRadius:6, border:'1.5px solid #10b981', fontSize:14, fontFamily:"'SF Mono','Fira Mono','Courier New',monospace", fontWeight:600, letterSpacing:'0.1em', color:Zk.foreground, background:Zk.background, outline:'none', boxShadow:'0 0 0 3px rgba(16,185,129,0.15)' }}/>
              <div style={{ position:'absolute', right:10, top:'50%', transform:'translateY(-50%)', color:'#10b981', display:'flex', alignItems:'center' }}>
                <IcoCheck size={16} stroke="#10b981"/>
              </div>
            </div>
          </div>
        </div>

        {/* Footer */}
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'14px 24px 20px', borderTop:`1px solid ${Zk.border}` }}>
          <button style={{ height:36, padding:'0 16px', background:Zk.background, border:`1px solid ${Zk.border}`, borderRadius:6, fontSize:13.5, fontWeight:500, color:Zk.foreground, cursor:'pointer' }}>Cancel</button>
          <button style={{ display:'inline-flex', alignItems:'center', gap:7, height:36, padding:'0 16px', background:Zk.destructive, border:'none', borderRadius:6, fontSize:13.5, fontWeight:500, color:'#fff', cursor:'pointer' }}>
            <IcoTrash size={14} stroke="#fff"/> Delete permanently
          </button>
        </div>
      </div>
    </div>
  );
}

function App() {
  return (
    <div style={{ fontFamily:"'Inter',system-ui,sans-serif", fontFeatureSettings:'"cv11" 1,"ss01" 1', WebkitFontSmoothing:'antialiased' }}>
      <BgPage/>
      <Dialog/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
