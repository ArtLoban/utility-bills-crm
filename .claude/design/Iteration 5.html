<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Utility Bills CRM — Iteration 5</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #18181b; }
  body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  * { box-sizing: border-box; }
  button, input, label { font-family: inherit; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="auth.jsx"></script>

<script type="text/babel" data-presets="react">
  // Artboard size: narrow card-style viewport
  const AW = 480, AH = 720;

  function App() {
    return (
      <window.DesignCanvas
        title="Utility Bills CRM — Iteration 5"
        subtitle="Auth screens · Login + Error · Light + Dark · shadcn New York · Zinc + Violet"
      >
        <window.DCSection
          id="auth-light"
          title="Light mode"
          subtitle="Login and Auth error — fullscreen centered card, zinc-50 background"
        >
          <window.DCArtboard id="login-light" label="Login · Light mode" width={AW} height={AH}>
            <LoginScreen/>
          </window.DCArtboard>
          <window.DCArtboard id="error-light" label="Auth error · Light mode" width={AW} height={AH}>
            <AuthErrorScreen/>
          </window.DCArtboard>
        </window.DCSection>

        <window.DCSection
          id="auth-dark"
          title="Dark mode"
          subtitle="Same layout — deep zinc bg, border elevation, Google button stays light"
        >
          <window.DCArtboard id="login-dark" label="Login · Dark mode" width={AW} height={AH}>
            <LoginScreen dark/>
          </window.DCArtboard>
          <window.DCArtboard id="error-dark" label="Auth error · Dark mode" width={AW} height={AH}>
            <AuthErrorScreen dark/>
          </window.DCArtboard>
        </window.DCSection>
      </window.DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
