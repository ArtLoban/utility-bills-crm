<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Utility Bills CRM — Providers page</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f0eee9; }
  body { font-family: 'Inter', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  button, input, textarea, select { font-family: inherit; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <rect width="100" height="100" fill="#7c3aed"/>
    <rect x="20" y="28" width="60" height="10" rx="3" fill="rgba(255,255,255,0.25)"/>
    <rect x="20" y="44" width="60" height="10" rx="3" fill="rgba(255,255,255,0.18)"/>
    <rect x="20" y="60" width="60" height="10" rx="3" fill="rgba(255,255,255,0.12)"/>
  </svg>
</template>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="dashboard.jsx"></script>
<script type="text/babel" src="iteration9.jsx"></script>
<script type="text/babel" src="providers.jsx"></script>

<script type="text/babel" data-presets="react">
  const AW = 1280;

  function App() {
    const DCanvas  = window.DesignCanvas;
    const DCSec    = window.DCSection;
    const DCBoard  = window.DCArtboard;
    const Screen   = window.ProvidersScreen;

    return (
      <DCanvas>
        <DCSec
          id="providers-light-desktop"
          title="Providers"
          subtitle="Light · Desktop · 1280 px — full-width card list, line-clamp expand on long notes, disabled delete with tooltip"
        >
          <DCBoard
            id="providers-light"
            label="Providers · Light · Desktop"
            width={AW}
            height={950}
          >
            <Screen theme="light" />
          </DCBoard>
          <DCBoard
            id="providers-dark"
            label="Providers · Dark · Desktop"
            width={AW}
            height={950}
          >
            <Screen theme="dark" />
          </DCBoard>
          <DCBoard
            id="providers-mobile-light"
            label="Providers · Mobile · Light"
            width={390}
            height={880}
          >
            <Screen theme="light" mobile={true} />
          </DCBoard>
        </DCSec>
      </DCanvas>
    );
  }

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
</script>
</body>
</html>
