<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Utility Bills CRM — Iteration 3</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #18181b; }
  body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  * { box-sizing: border-box; }
  button, input, textarea, select { font-family: inherit; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="dashboard.jsx"></script>
<script type="text/babel" src="service-detail.jsx"></script>
<script type="text/babel" src="modal-contract.jsx"></script>
<script type="text/babel" src="reminders.jsx"></script>

<script type="text/babel" data-presets="react">
  const W = 1440;

  function Frame({ children, height }) {
    return (
      <div style={{ width: '100%', height: '100%', overflow: 'hidden', background: '#fff' }}>
        {children}
      </div>
    );
  }

  function App() {
    return (
      <window.DesignCanvas
        title="Utility Bills CRM — Iteration 3"
        subtitle="Service detail · Update contract modal · Contract history drawer · Dark mode · shadcn New York · Zinc + Violet"
      >
        <window.DCSection
          id="service-detail"
          title="Service detail — Electricity"
          subtitle="Full page · metered two-zone service · light mode"
        >
          <window.DCArtboard id="sd-light" label="Service detail · Light mode" width={W} height={1960}>
            <Frame><ServiceDetail/></Frame>
          </window.DCArtboard>

          <window.DCArtboard id="sd-light-reminders" label="Service detail · Light · with Reminders section" width={W} height={2320}>
            <Frame><ServiceDetail reminders/></Frame>
          </window.DCArtboard>
        </window.DCSection>

        <window.DCSection
          id="reminders-states"
          title="Reminders — section states"
          subtitle="Surface A · the service-detail card · light mode · list / empty (linked + not linked) / disconnected / add disabled"
        >
          <window.DCArtboard id="rem-list" label="List — reminders present" width={760} height={400}>
            <window.RemindersStateStage label="State · list">
              <window.RemindersCard variant="list"/>
            </window.RemindersStateStage>
          </window.DCArtboard>

          <window.DCArtboard id="rem-empty-linked" label="Empty — Telegram linked" width={760} height={320}>
            <window.RemindersStateStage label="State · empty (linked)">
              <window.RemindersCard variant="empty-linked"/>
            </window.RemindersStateStage>
          </window.DCArtboard>

          <window.DCArtboard id="rem-empty-unlinked" label="Empty — Telegram not linked" width={760} height={320}>
            <window.RemindersStateStage label="State · empty (not linked)">
              <window.RemindersCard variant="empty-unlinked"/>
            </window.RemindersStateStage>
          </window.DCArtboard>

          <window.DCArtboard id="rem-disconnected" label="Disconnected banner + list" width={760} height={460}>
            <window.RemindersStateStage label="State · disconnected">
              <window.RemindersCard variant="disconnected"/>
            </window.RemindersStateStage>
          </window.DCArtboard>

          <window.DCArtboard id="rem-add-disabled" label="Add disabled · tooltip" width={760} height={430}>
            <window.RemindersStateStage label="State · add disabled (not linked)">
              <window.RemindersCard variant="add-disabled"/>
            </window.RemindersStateStage>
          </window.DCArtboard>
        </window.DCSection>

        <window.DCSection
          id="reminders-modal"
          title="Reminders — Add / Edit modal"
          subtitle="Surface B · 480px · the redesigned day-of-month picker (replaces the 1–31 dropdown)"
        >
          <window.DCArtboard id="rem-modal-default" label="Add reminder · default" width={620} height={640}>
            <window.ReminderModalStage label="Day mode · picker closed">
              <window.ReminderModal title="Add reminder" cta="Add reminder" day={5}/>
            </window.ReminderModalStage>
          </window.DCArtboard>

          <window.DCArtboard id="rem-modal-picker" label="Add reminder · day picker OPEN (key shot)" width={620} height={780}>
            <window.ReminderModalStage label="Day mode · picker open">
              <window.ReminderModal title="Add reminder" cta="Add reminder" day={29} pickerOpen/>
            </window.ReminderModalStage>
          </window.DCArtboard>

          <window.DCArtboard id="rem-picker-variants" label="Day picker — two directions" width={900} height={520}>
            <window.DayPickerVariants/>
          </window.DCArtboard>
        </window.DCSection>

        <window.DCSection
          id="modals"
          title="Modals &amp; drawers"
          subtitle="Update contract (Tariff changed selected) · Contract history side drawer"
        >
          <window.DCArtboard id="modal-contract" label="Update contract modal · Tariff changed" width={580} height={780}>
            <Stage2 label="Tariff changed selected">
              <UpdateContractModal/>
            </Stage2>
          </window.DCArtboard>

          <window.DCArtboard id="drawer-history" label="Contract history drawer · open" width={W} height={1200}>
            <Frame><ContractHistoryArtboard/></Frame>
          </window.DCArtboard>
        </window.DCSection>

        <window.DCSection
          id="dark"
          title="Dark mode"
          subtitle="Service detail — same content, dark theme (Zinc dark + border elevation)"
        >
          <window.DCArtboard id="sd-dark" label="Service detail · Dark mode" width={W} height={1960}>
            <div style={{ width: '100%', height: '100%', overflow: 'hidden', background: '#09090b' }}>
              <ServiceDetailDark/>
            </div>
          </window.DCArtboard>
        </window.DCSection>
      </window.DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
