<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Dashboard — Accent comparison (Print)</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #e4e4e7; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  * { box-sizing: border-box; }

  /* On-screen: stack pages with gutter so we can preview. */
  .page {
    width: 1440px;
    margin: 24px auto;
    background: #fff;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    overflow: hidden;
    position: relative;
  }
  .page-label {
    position: absolute;
    top: 16px; right: 24px;
    font-size: 11px;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    color: #71717a;
    font-weight: 500;
    z-index: 5;
    background: rgba(255,255,255,0.9);
    padding: 4px 10px;
    border: 1px solid #e4e4e7;
    border-radius: 999px;
  }

  @page {
    size: 1440px 1760px;
    margin: 0;
  }
  @media print {
    html, body { background: #fff; }
    .page {
      margin: 0;
      box-shadow: none;
      break-after: page;
      page-break-after: always;
      width: 1440px;
      height: 1760px;
    }
    .page:last-child {
      break-after: auto;
      page-break-after: auto;
    }
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#7c3aed"/><g transform="translate(50,50)" fill="#fff" font-family="Inter,system-ui,sans-serif" font-weight="700" font-size="28" text-anchor="middle"><text y="10">UB</text></g></svg></template>
</head>
<body>

<div class="page"><div class="page-label">Indigo</div><div id="root-indigo" style="height: 1760px;"></div></div>
<div class="page"><div class="page-label">Violet</div><div id="root-violet" style="height: 1760px;"></div></div>
<div class="page"><div class="page-label">Teal</div>  <div id="root-teal"   style="height: 1760px;"></div></div>

<script type="text/babel" src="components/dashboard.jsx"></script>
<script type="text/babel" data-presets="react">
  function Page({ accentKey }) {
    return (
      <div style={{ width: '100%', height: '100%', background: '#fff' }}>
        <Dashboard accentKey={accentKey} />
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root-indigo')).render(<Page accentKey="indigo" />);
  ReactDOM.createRoot(document.getElementById('root-violet')).render(<Page accentKey="violet" />);
  ReactDOM.createRoot(document.getElementById('root-teal')).render(<Page accentKey="teal" />);

  // Auto-print once fonts + render settle.
  (async () => {
    try { await document.fonts.ready; } catch (e) {}
    // Give React a tick and charts a frame.
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    await new Promise(r => setTimeout(r, 500));
    window.print();
  })();
</script>
</body>
</html>
